services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cybersentinel

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cybersentinel-backend:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database URL points at the "db" service name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MODEL_PATH: ${MODEL_PATH}
    volumes:
      # Mount the trained model folder so /predict works.
      - ./ml/models:/ml/models:ro
    ports:
      - "8000:8000"
    networks:
      - cybersentinel

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cybersentinel-frontend:dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - cybersentinel

volumes:
  pgdata:

networks:
  cybersentinel:
    driver: bridge
